packages:
  - 'packages/*'
  - 'dist'
allowBuilds:
  '@parcel/watcher': true
  bcrypt: true
  core-js: true
  es5-ext: true
  esbuild: true
  vue-demi: true
minimumReleaseAgeExclude:
